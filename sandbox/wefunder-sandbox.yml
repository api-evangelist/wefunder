modes:
  test_vs_live:
    key_prefixes:
      test: pk_test_
      live: pk_live_
    token_prefixes:
      test: at_test_
      live: at_live_
    note: The edge gateway routes by the credential's mode — a pk_test_ grant mints
      tokens in sandbox, pk_live_ in live; one token host serves both. Access tokens
      carry at_test_/at_live_ prefixes; sandbox-only endpoints refuse at_live_ tokens
      (documented SandboxOnly response) because they mint fake investors and money.
hosts:
