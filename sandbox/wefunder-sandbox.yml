  live_consent_host: https://wefunder.com/oauth
  note: The authorize (consent) host is picked from the client_id prefix — pk_test_
    redirects to the sandbox consent host.
server_environments:
  - environment: api
    url: https://api.wefunder.com/api/v2
    default: true
  - environment: staging
    url: https://staging.wefunder.com/api/v2
    note: Declared as a server variable in the OpenAPI.
