aid: wefunder
name: Wefunder
description: >-
  Wefunder is the largest SEC-registered funding portal, the home of the Community
  Round — a Public Benefit Corporation (YC W13) that has helped 4,400+ founders raise
  over $1B from more than one million everyday investors since 2012, with notable
  raises from Mercury, Substack, and Replit. Its OAuth 2.0 Wefunder API v2
  (api.wefunder.com) exposes public offerings, investments, campaigns, syndicates,
  write intents, and campaign attribution with signed webhooks, backed by an official
  TypeScript SDK (@wefunder/sdk) and PKCE-first authorization.
